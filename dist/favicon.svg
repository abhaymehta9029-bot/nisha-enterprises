<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#101D2C"/>
  <!-- Geometric structural hexagon / engineering frame -->
  <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" stroke="#F28C28" stroke-width="3" stroke-linejoin="round" fill="none" opacity="0.4"/>
  <!-- Tank silhouette -->
  <path d="M22,22 C22,17 42,17 42,22 L42,42 C42,46 22,46 22,42 Z" fill="#202A35" stroke="#F3F5F7" stroke-width="2.5"/>
  <!-- Tank Dish Ends and seam line -->
  <ellipse cx="32" cy="22" rx="10" ry="3.5" fill="#314255" stroke="#F3F5F7" stroke-width="2"/>
  <ellipse cx="32" cy="32" rx="10" ry="2" stroke="#F28C28" stroke-width="1.8" stroke-dasharray="2 2"/>
  <!-- Vertical structural engineering cross beams -->
  <path d="M16 32 L48 32" stroke="#F28C28" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3" fill="#F28C28"/>
</svg>
